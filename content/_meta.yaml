# ------------------------------------------------------------
# 可视化参数
# ------------------------------------------------------------
max_visual_degree: 8     # 单节点最多可视连接数，超出部分降级为超链接/软连接
node_importance: 60      # 节点体积基准值（基于连接数/被引用数）
link_weight_semantics:   # weight 标定说明
  5: "几乎等价/直接可推导（如牛顿力学与拉格朗日力学）"
  4: "强关联，一个的掌握直接依赖另一个"
  3: "相关，共享部分概念或方法"
  2: "弱相关，仅偶尔交叉"
  1: "边缘联系，提供背景视角"
