# ============================================================
# 中文物理知识树 —— 全局元数据
# 本文件定义：站点信息、领域(domain)体系、云图参数、可视化参数
# 由 build.py 读取，并合并进 site/data/graph.js
# ============================================================

site:
  title: 中文物理知识树
  subtitle: Physics Knowledge Graph
  description: 以"四大力学"为主干的物理与数学知识网络

# ------------------------------------------------------------
# 领域体系：每个领域一块区域、一种颜色、一团半透明云
# color: 节点/云图主色（16 进制）
# cloud_alpha: 云图不透明度 0~1（越小越透明，允许领域重叠）
# cloud_r: 云图半径系数（相对节点散布大小的比例）
# ------------------------------------------------------------
domains:
  mathematics:
    name: 数学基础
    color: "#8e9eab"
    cloud_alpha: 0.07
    cloud_r: 1.0
